<style>

:root{color-scheme:light}
body{

.brand .tag{font-size:11px;color:var(--muted);letter-spacing:.08em}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.m{min-width:0}
.m label{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.m label span{font-variant-numeric:tabular-nums;color:var(--fg)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:100%;transition:width .3s}

canvas{display:block;width:100%;height:clamp(200px,52vw,240px);touch-action:none}

function nz(dur,g,ft,f,q,when,f2){

  s.buffer=AU.nb; fl.type=ft; fl.frequency.setValueAtTime(f,t); if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+dur); fl.Q.value=q||1;
  v.gain.setValueAtTime(0.0001,t); v.gain.exponentialRampToValueAtTime(g,t+Math.min(0.02,dur/2)); v.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(fl); fl.connect(v); v.connect(AU.m); s.start(t,Math.random()); s.stop(t+dur+0.05);
}
function sfx(k){
  if(!AU.c||!AU.on) return;
  if(k==='click') tone(1100,0.03,'sine',0.03);
  else if(k==='hit'){ tone(95,0.28,'sine',0.22,0,45); nz(0.12,0.05,'lowpass',500,1); }
  else if(k==='cough'){ for(var i=0;i<3;i++) nz(0.09,0.08,'bandpass',850,3,i*0.14); }
  else if(k==='shutter'){ nz(0.03,0.1,'highpass',3000,1); nz(0.04,0.1,'highpass',2200,1,0.07); }
  else if(k==='ding'){ tone(1568,0.6,'sine',0.05); tone(1175,0.7,'sine',0.04,0.14); }
  else if(k==='bad') tone(190,0.3,'triangle',0.06,0,120);
  else if(k==='wind') nz(1.1,0.07,'bandpass',300,2,0,1000);
  else if(k==='warn'){ tone(660,0.08,'sine',0.04); tone(660,0.08,'sine',0.04,0.18); }
  else if(k==='scrape') nz(0.08,0.09,'highpass',3000,1);
  else if(k==='lighter'){ nz(0.02,0.07,'highpass',4000,1); tone(2400,0.02,'square',0.015,0.03); }
  else if(k==='blip') tone(880,0.12,'sine',0.045);
  else if(k==='end'){ tone(330,1.4,'sine',0.05,0,196); tone(262,1.6,'sine',0.04,0.2,147); }
}
var SCALES={
  1:{n:[440,523.25,587.33,659.25,783.99,880],step:900,p:0.55,g:0.05},
  2:{n:[659.25,783.99,987.77,1174.66],step:1500,p:0.4,g:0.04},
  3:{n:[987.77,1318.51,1479.98],step:2300,p:0.3,g:0.035},
  4:{n:[329.63,392,440,493.88,587.33],step:1700,p:0.45,g:0.05}
};
function note(f,g,bus){
  var c=AU.c, t=c.currentTime, o=c.createOscillator(), o2=c.createOscillator(), v=c.createGain();
  o.type='sine'; o2.type='triangle'; o.frequency.value=f; o2.frequency.value=f*2.0;
  var v2=c.createGain(); v2.gain.value=0.18; o2.connect(v2); v2.connect(v);
  v.gain.setValueAtTime(0.0001,t); v.gain.exponentialRampToValueAtTime(g,t+0.015); v.gain.exponentialRampToValueAtTime(0.0001,t+2.6);
  o.connect(v); v.connect(bus); o.start(t); o2.start(t); o.stop(t+2.7); o2.stop(t+2.7);
}
function auAmb(ch){
  AU.ch=ch; if(!AU.c) return; auStop();
  if(AU.mode!==2) return;
  var c=AU.c, S0=SCALES[ch]||SCALES[1];
  var lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3200; lp.Q.value=0.4; AU.lp=lp;
  var bus=c.createGain(); bus.gain.value=1; bus.connect(lp); lp.connect(AU.m);
  var dl=c.createDelay(1.5); dl.delayTime.value=0.42; var fb=c.createGain(); fb.gain.value=0.38; var wet=c.createGain(); wet.gain.value=0.5;
  var df=c.createBiquadFilter(); df.type='lowpass'; df.frequency.value=2200;
  bus.connect(dl); dl.connect(df); df.connect(fb); fb.connect(dl); df.connect(wet); wet.connect(lp);
  var last=-1;
  AU.tm.push(setInterval(function(){
    if(!AU.on||AU.mode!==2||Math.random()>S0.p) return;
    var k; do{ k=(Math.random()*S0.n.length)|0 }while(k===last&&S0.n.length>1); last=k;
    note(S0.n[k],S0.g*(0.7+Math.random()*0.5),bus);
  },S0.step));
  if(ch===3) AU.tm.push(setInterval(function(){ if(AU.on) nz(0.025,0.03,'highpass',4500,1) },1000));
  if(ch===2) AU.tm.push(setInterval(function(){ if(AU.on) tone(1000,0.07,'sine',0.012) },5200));
}

function next(){

function loop(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0); last=ts; frame++;
  if(frame%30===1) readColors();
  if(!M) M={};
  if(mode==='dodge') updDodge(dt); else if(mode==='photo') updPhoto(dt); else if(mode==='pass') updPass(dt); else if(mode==='ride') updRide(dt); else if(mode==='scale') updScale(dt); else if(mode==='find') updFind(dt);
  updParts(dt);
  ctx.clearRect(0,0,W,H);
  if(mode==='dodge') drawDodge();
  else if(mode==='pass'){ drawPass(); drawParts(); }
  else if(mode==='ride') drawRide();
  else if(mode==='scale') drawScale();
  else if(mode==='find') drawFind();
  else if(mode==='cover') drawCover();
  else{
    var sc=SC[Math.min(S.idx||0,SC.length-1)];
    if(sc.kind==='ride') drawRide();
    else if(sc.kind==='clinic'){ drawClinic(); drawParts(); }
    else{
      drawWorld(sc.kind,sc);
      if(sc.kind==='laundry') figure(W*0.2,gy(),{look:PARENT,dir:1,arm:'push'}); else stroller(W*0.2,gy(),false);
      if(sc.kind==='find'&&sc.elev&&sc.revealed){
        var wg=winGeom(sc.elev); ctx.save(); ctx.beginPath(); ctx.rect(smokerX()-20,wg.wy,40,wg.wh); ctx.clip();
        smoker(smokerX(),wg.fy,'',sc.look||sc.seed,false); ctx.restore();
      } else if(!(sc.kind==='find'&&!sc.revealed)&&!sc.nosmoker) smoker(smokerX(),gy()-(sc.elev||0),sc.who,sc.look||sc.seed,sc.kind==='crossing');
      if(sc.kind==='stairs') ivPole(smokerX(),gy());
      if(sc.kind==='balcony') balconyRail(sc);
      drawParts();
    }
    if(mode==='photo') drawPhoto();
  }
  var psc2=curSc();
  post(mode!=='cover'&&!!(psc2&&psc2.dark&&psc2.kind!=='clinic'));
  requestAnimationFrame(loop);
}
